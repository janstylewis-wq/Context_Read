# Postgres and S3-compatible storage for ContextRead. Start with: docker compose up -d
# Values come from the .env file next to this one (written by `contextread init`).
name: contextread

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextread
      POSTGRES_DB: contextread
      POSTGRES_PASSWORD: ${APP_PG_PASSWORD:?set APP_PG_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextread -d contextread -q"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # any S3-compatible server works: point S3_ENDPOINT_URL and the keys in .env at it instead
    image: ${S3_IMAGE:-rustfs/rustfs:1.0.4}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${S3_PORT:-9100}:9000"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
