[project]
name = "contextread"
version = "0.3.0"
description = "Traceable answers from long documents: PDFs indexed into a tree of sections, a chat agent that reads the right pages, REST and MCP APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp==2.3.0",
    "openai>=2.43",
    "pageindex==0.5.0",
    "pdfplumber>=0.11",
    "Pillow>=10",
    "psycopg[binary]>=3.2",
    "pypdfium2>=5",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
contextread = "contextread.cli:main"
contextread-worker = "contextread.worker.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextread = ["mcp/contract.json", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes a real (billed, budget-guarded) LLM call; run with `pytest -m live`"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# line width is enforced by `ruff format`; E501 would only flag long strings and comments
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency/parameter markers are meant to be called in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form"]
